<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proyecto Integrador{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilo propio compilado mediante Jinja2 url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Componente reutilizable: Navbar -->
    {% include "components/navbar.html" %}

    <main class="container my-4">
        <!-- Bloque de contenido dinámico -->
        {% block content %}
        {% endblock %}
    </main>

    <!-- Componente reutilizable: Footer -->
    {% include "components/footer.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script propio compilado mediante Jinja2 url_for -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
