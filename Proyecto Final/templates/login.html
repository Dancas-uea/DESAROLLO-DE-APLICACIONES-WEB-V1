{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="login-wrapper" style="margin: -1.5rem -12px;">
  <div class="login-card card">
    <div class="card-header">
      <h4 class="text-white">
        <i class="bi bi-shield-lock-fill me-2"></i>Iniciar Sesión
      </h4>
      <p class="text-white-50 mb-0 mt-1" style="font-size:0.85rem;">Sistema de Gestión Integral</p>
    </div>
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al sistema
        </button>
      </form>
    </div>
    <div class="card-footer text-center py-3" style="background:#f8fafc; border-radius: 0 0 16px 16px;">
      <small class="text-muted">Usuario: <strong>admin</strong> &nbsp;|&nbsp; Contraseña: <strong>admin123</strong></small>
    </div>
  </div>
</div>
{% endblock %}
